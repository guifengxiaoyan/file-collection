{% extends "base.html" %}

{% block content %}
<div class="auth">
    <div class="auth__card">
        <div class="auth__brand"><i class="fas fa-cloud-upload-alt"></i></div>
        <h1 class="auth__title">管理员登录</h1>
        <p class="auth__subtitle">文件收集系统 · 后台管理</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                <div class="flash flash--{{ category }}">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="form__group">
                <label class="form__label" for="username"><i class="fas fa-user"></i> 用户名</label>
                <input type="text" id="username" name="username" required placeholder="输入用户名" autocomplete="username">
            </div>
            <div class="form__group">
                <label class="form__label" for="password"><i class="fas fa-lock"></i> 密码</label>
                <input type="password" id="password" name="password" required placeholder="输入密码" autocomplete="current-password">
            </div>
            <button type="submit" class="btn btn--primary" style="width: 100%; justify-content: center;">
                <i class="fas fa-sign-in-alt"></i> 登录
            </button>
        </form>

        <div class="auth__foot">
            <a href="{{ url_for('index') }}"><i class="fas fa-home"></i> 返回首页</a>
        </div>
    </div>
</div>
{% endblock %}
