{% extends "admin_base.html" %}

{% block sidebar %}
<aside class="admin__sidebar">
    <div class="admin__brand"><i class="fas fa-cog"></i> 管理后台</div>
    <nav class="admin__nav">
        <a class="admin__navlink" href="{{ url_for('admin_dashboard') }}?tab=overview"><i class="fas fa-chart-bar"></i> 概览</a>
        <a class="admin__navlink" href="{{ url_for('admin_dashboard') }}?tab=announcements"><i class="fas fa-bullhorn"></i> 公告管理</a>
        <a class="admin__navlink" href="{{ url_for('admin_dashboard') }}?tab=themes"><i class="fas fa-folder-open"></i> 主题管理</a>
    </nav>
    <div class="admin__navsep"></div>
    <div class="admin__navfoot">
        <a class="admin__navlink admin__navlink--active" href="{{ url_for('change_password') }}"><i class="fas fa-key"></i> 修改密码</a>
        <a class="admin__navlink" href="{{ url_for('admin_logout') }}"><i class="fas fa-sign-out-alt"></i> 退出登录</a>
    </div>
</aside>
{% endblock %}

{% block admin_content %}
<div class="form-page">
    <div class="form-card">
        <h2><i class="fas fa-key"></i> 修改密码</h2>
        <form method="POST">
            <div class="form__group">
                <label class="form__label"><i class="fas fa-lock"></i> 原密码</label>
                <input type="password" name="old_password" required placeholder="输入原密码">
            </div>
            <div class="form__group">
                <label class="form__label"><i class="fas fa-key"></i> 新密码</label>
                <input type="password" name="new_password" required placeholder="输入新密码（至少6位）">
            </div>
            <div class="form__group">
                <label class="form__label"><i class="fas fa-key"></i> 确认新密码</label>
                <input type="password" name="confirm_password" required placeholder="再次输入新密码">
            </div>
            <div class="form__actions">
                <button type="submit" class="btn btn--primary"><i class="fas fa-save"></i> 保存修改</button>
                <a href="{{ url_for('admin_dashboard') }}" class="btn btn--secondary"><i class="fas fa-arrow-left"></i> 返回</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
