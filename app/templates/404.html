{% extends "base.html" %}

{% block content %}

        <div class="error__code">404</div>
        <p class="error__text"><i class="fas fa-search"></i> 抱歉，您访问的页面不存在或已被移动。</p>
        <div class="error__actions">
            <a href="{{ url_for('index') }}" class="btn btn--primary">

        </div>
        <div class="error__foot">
            <a href="{{ url_for('admin_login') }}"><i class="fas fa-user-shield"></i> 管理员入口</a>
        </div>
    </div>
</div>
{% endblock %}
